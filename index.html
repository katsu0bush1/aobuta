<script>
/* ============================================================================

   設定判別＆実戦メモ
   ----------------------------------------------------------------------------
   ★この機種の最大の特徴: **設定1の解析値がどのサイトにも無い**（2026-10 時点で「調査中」）。
     代わりに **下パネル消灯＝設定1** という目視で確定できる仕掛けがある。
     → 本ツールは「設定1は下パネルで決める／点灯なら 2〜6 で推定する」という形にしている。
        設定1に適当な数字を代入して6段階で推定すると**嘘をつく**ので、そうしない。
   ★数値は解析サイトの公開値のみ。**出典のない数字は入れない**。
     設定差が公開されていない項目（小役確率そのもの等）は「解説」タブに「不明」と明記する。
   ============================================================================ */
var SETS=[2,3,4,5,6];                 // ★推定の対象。設定1は下パネルで別途決める
var ALLSET=[1,2,3,4,5,6];
var SC={1:"#78909C",2:"#42A5F5",3:"#66BB6A",4:"#FFA726",5:"#EF5350",6:"#AB47BC"};

var SQ_CHERRY={2:4610.7,3:4605.9,4:4516.7,5:4479.2,6:4351.3};
var SQ_CHANCE={2:32157.6,3:31072.7,4:20459.1,5:20776.7,6:20555.8};

var PTMAX={2:12387.9,3:12163.0,4:12210.3,5:11518.1,6:8348.9};   // 咲太ポイントMAX発動率 1/x
var PT400={2:.010,3:.010,4:.012,5:.013,6:.028};                 /* 400pt の前兆移行率 */

var PT300={2:.30,3:.34,4:.40,5:.40,6:.40};

var SOFT={

/* ===== 時系列ログのイベント種別 =====

var TYPES=[
 /* ⚠️ 2026-10-19 是正: 「規定pt」はCZ（エピソードチャンス）の契機であってボーナス直撃ではない。

 {k:"at",   l:"青春ボーナス", ic:"🔥", cnt:"at",
  res:["アオハル経由","エピソードチャンス","ボーナス天井(899G/699G)","観測目→フリーズ","不明"],
  free:"メモ（任意）"},
 /* ⚠️ 2026-10-19 是正: アオハルチャンスは**報酬獲得ゾーン**で、突入時点で必ず報酬が確定する

    「非当選」は存在しない。レア役からの当選は別カウンタ（チェリー/チャンス目）で数える。 */
 {k:"ao",   l:"アオハルチャンス", ic:"✨", cnt:"ao",
  res:["青春チャージ","ドリームコレクション","エピソードチャンス","青春ボーナス"], free:"契機（任意）"},
 {k:"cz",   l:"エピソードチャンス(CZ)", ic:"🎬", res:["成功","失敗"],

 {k:"quest",l:"咲太クエスト", ic:"📖",
  opts:[{l:"ベル",c:"sqBell"},{l:"スイカ",c:"sqSuika"},{l:"チェリー",c:"sqCherry"},{l:"チャンス目",c:"sqChance"}],

 {k:"ptmax",l:"咲太ポイントMAX", ic:"⭐", cnt:"ptmax", free:"メモ（任意）"},

/* ------------------------------------------------------------- 推定エンジン */
function estimate(){
 var ll={},i,s,mask={},reasons=[],confs=[],warn=[],used=0;
 for(i=0;i<SETS.length;i++){ll[SETS[i]]=0;mask[SETS[i]]=true}
 function bino(n,d,rates,label,unit,weight){
  if(!d||!rates)return;
  if(n>d){return}   /* 分母超過の文言はペアの整合性チェックで1本に出す（重複させない） */
  used++;var w=(weight===undefined?1:weight);
  for(i=0;i<SETS.length;i++){s=SETS[i];
   var p=(unit==="1/x")?(1/rates[s]):rates[s];
   p=Math.min(.999,Math.max(.00002,p));
   ll[s]+=w*(n*Math.log(p)+(d-n)*Math.log(1-p));}
  reasons.push(label+" "+n+"/"+d+(unit==="1/x"?(n?" (1/"+Math.round(d/n)+")":""):(" ("+(n/d*100).toFixed(1)+"%)")));
 }
 CNTS.forEach(function(sec){sec.items.forEach(function(it){
  // ★ ペア（分母＋当選）は「当選/分母」の二項で見る。分母は尤度に使わない
  if(it.hit){
   if(!it.hit.r)return;                  // 設定差が公開されていない組（スイカ等）は記録のみ
   if(!TRACK[it.k])return;
   var dd=CC[it.k]||0, hh=CC[it.hit.k]||0;
   if(!dd)return;
   bino(hh,dd,it.hit.r,it.n+"→"+it.hit.n,it.hit.u,1);
   return;}
  if(!it.r)return;                       // 分母カウンタ等は尤度に使わない
  // ★ **数えていない項目は使わない**。0回を証拠にすると低設定へ系統的に偏る（上の TRACK の注を参照）
  if(!TRACK[it.k])return;
  var n=CC[it.k]||0,d=denom(it);
  if(!d)return;
  if(it.k==="at"&&G<1000&&n===0)return;   // 序盤の「まだ当たっていない」は情報にならない
  // ⚠️ スイカ契機の咲太クエストは設定2だけ極端で非単調＝過信しないよう半分の重み
  bino(n,d,it.r,it.n,it.u,(it.k==="sqSuika")?0.5:1);
 })});
 // 示唆
 SIG.forEach(function(x){var n=CC[x.k];if(!n)return;
  if(x.m){var mm={};x.m.forEach(function(v){mm[v]=1});
   for(i=0;i<SETS.length;i++)if(!mm[SETS[i]])mask[SETS[i]]=false;
   confs.push(x.l+"→"+x.h);used++;}
  else if(x.soft&&USE_SOFT){used++;
   for(i=0;i<SETS.length;i++){s=SETS[i];ll[s]+=n*Math.log(SOFT[x.soft][s])}}
 });
 var any=false;for(i=0;i<SETS.length;i++)if(mask[SETS[i]])any=true;
 if(!any){for(i=0;i<SETS.length;i++)mask[SETS[i]]=true;
  warn.push("確定要素どうしが矛盾しています（入力ミスの可能性）。制約を解除して表示しています")}
 var mx=-Infinity;for(i=0;i<SETS.length;i++)if(mask[SETS[i]]&&ll[SETS[i]]>mx)mx=ll[SETS[i]];
 var ex={},z=0;for(i=0;i<SETS.length;i++){s=SETS[i];var v=mask[s]?Math.exp(ll[s]-mx):0;ex[s]=v;z+=v}
 var post={};for(i=0;i<SETS.length;i++){s=SETS[i];post[s]=z?ex[s]/z:0}
 var best=SETS[0],bp=-1,esum=0,odd=0,even=0,hi=0;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(post[s]>bp){bp=post[s];best=s}
  esum+=s*post[s];if(s%2)odd+=post[s];else even+=post[s];if(s>=4)hi+=post[s]}
 // 入力の整合性
 CNTS.forEach(function(sec){sec.items.forEach(function(it){if(!it.hit)return;
  if((CC[it.hit.k]||0)>(CC[it.k]||0))
   warn.push(it.n+"の"+it.hit.n+" "+(CC[it.hit.k]||0)+"回 > 成立 "+(CC[it.k]||0)+"回")})});
 var sN=0;SIG.forEach(function(x){if(x.soft)sN+=CC[x.k]||0});
 if(sN&&USE_SOFT)reasons.push("示唆演出 "+sN+"回（重みは仮置き）");
 return {post:post,best:best,bestP:bp,exp:esum,odd:odd,even:even,hi:hi,
         used:used,reasons:reasons,confs:confs,warn:warn,mask:mask};
}

 if(MEMO){L.push("");L.push("[メモ]");L.push("  "+MEMO.replace(/\n/g,"\n  "))}
 return L.join("\n");
}
